# This is a basic workflow to help you get started with Actions

name: Comunicador de la legio

on:
 workflow_dispatch:
  inputs:
    villano:
        description: "que villano desea enviar el mensaje"
        required: true
        type: choice
        options: 
          - "Dr. Maligno"
          - "El Hombre de Acero"
          - "El Hombre Araña"
          - "El Hombre Invisible"
          - "El Hombre Lobo"
          - "El Hombre de Hielo"
          - "El Hombre de Fuego"
          - "El Hombre de Piedra"
          - "El Hombre de Hierro"
          - "El Hombre de Oro"
          - "El Hombre de Plata"
          - "El Hombre de Bronce"
          - "El Hombre de Cobre"
    mensaje:
        description: "mensaje para el consejo"
        required: true
        default: "la misión ha sido completada con éxito"

    prioridad:
        description: "prioridad del mensaje"
        required: true
        type: choice
        options: 
          - "Alta"
          - "Media"
          - "Baja"

jobs:
  tranmiter-mensaje:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: "El agente llega a la fortaleza"
        run: |
          echo "El agente llega a la fortaleza"
          echo "Agente ${{ github.actor }} accediendo a la fortaleza prohibida"
          echo ""
          echo "Repositorio: ${{ github.repository }}"
          echo "operación: ${{ github.event_name }}" 
          df -vh
          free -h
          uname -a
          node --version
          git --version
          python3 --version
          echo "Directorio actual: $(pwd)"
          ping -c 4 google.com
          echo "Conexión establecida con google.com"
          getent passwd
          getent group
          lscpu
          nproc --all
      - name : "desbloquea la boveda del tesoro"
        uses: actions/checkout@v3
      - name: "El agente se despide"
        run: |
          echo "El agente se despide"
          df -vh
          free -h
          uname -a
          node --version
          git --version
          ls inteligencia/
