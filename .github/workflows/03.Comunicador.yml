# This is a basic workflow to help you get started with Actions

name: Comunicador de la legio

on:
 workflow_dispatch:
  inputs:
    villano:
        description: "que villano desea enviar el mensaje"
        required: true
        type: choice
        options: 
          - "El Hombre Araña"
          - "El Hombre Invisible"
          - "El Hombre Lobo"
          - "El Hombre de Hielo"
          - "El Hombre de Fuego"
          - "El Hombre de Piedra"
          - "El Hombre de Hierro"
          - "El Hombre de Oro"
          - "El Hombre de Plata"
          - "El Hombre de Bronce"
          - "El Hombre de Cobre"
    mensaje:
        description: "mensaje para el consejo"
        required: true
        default: "la misión ha sido completada con éxito"

    prioridad:
        description: "prioridad del mensaje"
        required: true
        type: choice
        options: 
          - "Alta"
          - "Media"
          - "Baja"

jobs:
  tranmiter-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: imprimir inputs
        run: |
          echo "Inputs: "
          echo "villano: ${{inputs.villano}}"
          echo "mensaje: ${{inputs.mensaje}}"
          echo "prioridad: ${{inputs.prioridad}}"
