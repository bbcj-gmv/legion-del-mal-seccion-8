# This is a basic workflow to help you get started with Actions

name: Comunicador de la legion 

on:
 workflow_dispatch:
  inputs:
    villano:
        description: "que villano desea enviar el mensaje"
        required: true
        type: choice
        options: 
          - "El Hombre Araña"
          - "El Hombre Invisible"
          - "El Hombre Lobo"
          - "El Hombre de Hielo"
          - "El Hombre de Fuego"
          - "El Hombre de Piedra"
          - "El Hombre de Hierro"
          - "El Hombre de Oro"
          - "El Hombre de Plata"
          - "El Hombre de Bronce"
          - "El Hombre de Cobre"
          - "El Hombre de Plomo"
    mensaje:
        description: "mensaje para el consejo"
        required: true
        default: "la misión ha sido completada con éxito"

    prioridad:
        description: "prioridad del mensaje"
        required: true
        type: choice
        options: 
          - "Alta"
          - "Media"
          - "Baja"

jobs:
  tranmiter-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: instalar el transmisor de la legion
        run: sudo apt-get install -y cowsay
      - name: imprimir inputs
        run: |
          echo " ----------------------------------------"
          echo "         transmisión interceptada"
          echo " ----------------------------------------"
          echo " de: ${{ inputs.villano }}"
          echo "El villano es: ${{ inputs.villano }}"
          echo "Nivel: ${{ inputs.prioridad }}"
          echo "Mensaje: ${{ inputs.mensaje }}"
          echo " fecha: $(date -u "+%Y-%m-%d -%H:%M:%SZ UTC")"
          cowsay -f eyes "${{ inputs.mensaje }}"
          echo ""
          echo " ------ ${{inputs.villano}} ------"
          echo "...."
        
