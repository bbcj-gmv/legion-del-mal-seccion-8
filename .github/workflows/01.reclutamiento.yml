name: Reclutamiento de Agente
on: push

jobs:
  reporte-de-reclutamiento:
    runs-on: ubuntu-latest
    steps:
      # FIX 1: Bring your repository files into the runner machine
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: El agente se presenta
        run: echo "El agente se presenta"

      - name: El agente se despide
        run: echo "El agente se despide"

      - name: Reporte de identidad
        run: |
          echo "Reporte de reclutamiento"
          echo ""
          echo "Nombre del agente: ${{ github.actor }}"
          echo ""
          echo "Repositorio: ${{ github.repository }}"
          echo "operación: ${{ github.event_name }}"
          echo "metadatos: ${{ toJson(github.event) }}"

      - name: capacidad del agente
        run: |
          echo "capacidad del agente" 
          uname -a
          node --version
          git --version
          python3 --version

      - name: Reconocimiento del terreno
        run: |
          echo "Reconocimiento del terreno"
          echo "Directorio actual: $(pwd)"
          echo "Archivos en el directorio:"
          ls -la
          # FIX 2: Fixed the broken ls command
